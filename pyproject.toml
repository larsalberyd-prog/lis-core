[project]
name = "lis-core"
version = "0.1.0"
description = "Lead Intelligence System core — agent layer (Ravema launching customer)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.103",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-q"

[tool.lis-core]
default_model = "claude-sonnet-4-6"
eval_threshold = 0.85
